<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>News Article Publisher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input[type="file"] {
      width: 100%;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background: #0056b3;
    }
    #status {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Publish New Article</h2>

    <form id="uploadForm">
      <input type="file" name="article" required />
      <button type="submit">Publish Article</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
     

    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch('http://localhost:3000/upload', {
          method: 'POST',
          body: formData
        });


        const text = await response.text();
        statusDiv.innerText = text;
        statusDiv.style.color = 'green';

      } catch (error) {
        statusDiv.innerText = 'Upload failed';
        statusDiv.style.color = 'red';
      }
    });
  </script>

</body>
</html>
