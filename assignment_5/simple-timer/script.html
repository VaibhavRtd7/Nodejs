<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Timer</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 50px;
        }

        #timer {
            font-size: 30px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            cursor: no-drop;
        }
    </style>
</head>

<body>

    <h1>2 hour Timer </h1>
    <div id="timer"> 02:00:00 </div>
    <button id="startBtn"> Start </button>
    <script src="myscript.js"></script>
</body>

</html>
